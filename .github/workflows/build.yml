name: Manual Kernel Build

# 1. Manual Dispatch
on:
  workflow_dispatch:
    inputs:
      ksu_type:
        description: 'Select KernelSU Flavor'
        required: true
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'ksu'
          - 'ksunext'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev clang lld base-files tar xz-utils cpio dwarves zip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Adding the ksu_type to the key prevents cache contamination between different KSU states
          key: kernel-ccache-${{ github.event.inputs.ksu_type }}-${{ github.sha }}
          restore-keys: |
            kernel-ccache-${{ github.event.inputs.ksu_type }}-
            kernel-ccache-
          max-size: 2G

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: prebuilts/clang/host/linux-x86
          key: clang-android14-release

      - name: Build kernel
        env:
          KSU_TYPE: ${{ github.event.inputs.ksu_type }}
        run: |
          chmod +x build.sh
          ./build.sh

      # 2. Package the compiled image dynamically into AnyKernel3
      - name: Package with AnyKernel3
        run: |
          echo "Cloning AnyKernel3 template..."
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          rm -rf anykernel/.git anykernel/README.md
          
          echo "Injecting compiled kernel Image..."
          cp arch/arm64/boot/Image anykernel/
          
          echo "Creating flashable zip archive..."
          cd anykernel
          zip -r9 ../anykernel3-gki-build.zip *
          
# Required secret is BOT_TOKEN (collect it from botfather in telegram) and set it repository ssecrets
# replace the chat_id= with user chat ID from telegram
# get chat_id from @userinfobot in telegram
      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          COMMIT=$(git log -1 --pretty=format:"%s (%h)")
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          KSU_STATUS="${{ github.event.inputs.ksu_type }}"
          
          CAPTION=$(printf "Kernel Build Successful\nVariant: %s\nCommit: %s\nDate: %s" "$KSU_STATUS" "$COMMIT" "$DATE")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F chat_id="6779570748" \
            -F document="@anykernel3-gki-build.zip" \
            -F caption="$CAPTION"
            
